metadata:
  name: suse-virtualization
  version: 1.9.1
  creationDate: "2026-11-14"
corePlatform:
  image: "registry.suse.com/beta/uc/rke2/rke2-manifest:1.36"
components:
  systemd:
    extensions:
      - name: "suse-storage"
        image: "registry.suse.com/beta/uc/longhorn:6.9-5.17"
  helm:
    charts:
      - chart: "cert-manager"
        version: "v1.21.3"
        namespace: "cert-manager"
        repository: "jetstack"
        values:
          crds:
            enabled: true
      - chart: "rancher"
        version: "2.15.3"
        namespace: "cattle-system"
        repository: "rancher-prime"
        dependsOn:
          - name: "cert-manager"
            type: "helm"
        values:
          replicas: 1 # Update after PoC
          features: "multi-cluster-management=false,multi-cluster-management-agent=false"
          useBundledSystemChart: true
          postDelete:
            enabled: false
          global:
            cattle:
              systemDefaultRegistry: registry.rancher.com
            psp:
              enabled: "false"
      - chart: "suse-storage"
        version: "1.11.3"
        namespace: "longhorn-system"
        repository: "application-collection"
        values:
          global:
            imagePullSecrets:
              - name: "application-collection"
          longhorn:
            persistence:
              defaultClass: false
              defaultClassReplicaCount: 1
            defaultSettings:
              createDefaultDiskLabeledNodes: true
              defaultDataLocality: best-effort
              defaultLonghornStaticStorageClass: harvester-longhorn
              autoDeletePodWhenVolumeDetachedUnexpectedly: true
              blacklistForAutoDeletePodWhenVolumeDetachedUnexpectedly: "kubevirt.io/VirtualMachineInstance"
              priorityClass: system-cluster-critical
              nodeDrainPolicy: "block-if-contains-last-replica"
              autoCleanupSnapshotWhenDeleteBackup: true
              orphanResourceAutoDeletion: "instance"
              concurrentAutomaticEngineUpgradePerNodeLimit: 3
              defaultReplicaCount: '{"v1":"1","v2":"1"}' # Update after PoC
              allowRecurringJobWhileVolumeDetached: true
        dependsOn:
          - name: "suse-storage"
            type: "sysext"
      - chart: "rancher-monitoring-crd"
        repository: "rancher-charts"
        version: "110.0.2+up80.9.1-rancher.22"
        namespace: "cattle-monitoring-system"
      - chart: "harvester-crd"
        repository: "harvester"
        version: "1.9.1"
        namespace: "harvester-system"
        dependsOn:
          - name: "rancher-monitoring-crd"
            type: "helm"
      - chart: "harvester-addons"
        repository: "harvester"
        version: "1.9.1"
        namespace: "harvester-system"
        dependsOn:
          - name: "harvester"
            type: "helm"
      - chart: "harvester"
        repository: "harvester"
        version: "1.9.1"
        namespace: "harvester-system"
        values:
          replicas: 1 # Update after PoC
          webhook:
            replicas: 1 # Update after PoC
          containers:
            apiserver:
              hciMode: false
          promote:
            clusterPodCIDR: 10.42.0.0/16
            clusterServiceCIDR: 10.43.0.0/16
            clusterDNS: 10.43.0.10
          rancherEmbedded: false
          longhorn:
            enabled: false
          service:
            vip:
              enabled: false
          storageClass:
            replicaCount: 1 # Update after PoC
          harvester-node-disk-manager:
            enabled: true
            labelFilter:
              - EFI
              - RECOVERY
              - SYSTEM
              - CONFIG
              - ignition
        dependsOn:
          - name: "rancher"
            type: "helm"
          - name: "suse-storage"
            type: "helm"
          - name: "harvester-crd"
            type: "helm"
    repositories:
      - name: "jetstack"
        url: "https://charts.jetstack.io"
      - name: "application-collection"
        url: "oci://dp.apps.rancher.io/charts"
      - name: "rancher-prime"
        url: "https://charts.rancher.com/server-charts/prime"
      - name: "rancher-charts"
        url: "https://charts.rancher.io"
      - name: "harvester"
        url: "https://download.opensuse.org/repositories/home:/roxenham:/harvester-elemental3/containers"
